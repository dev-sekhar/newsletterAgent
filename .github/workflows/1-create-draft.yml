# .github/workflows/1-create-draft.yml

name: '1: Create Newsletter Draft for Review'

on:
  # This workflow can be run on a schedule or manually
  schedule:
    # Runs every Friday at 12:00 PM UTC. You can change this cron schedule.
    - cron: '0 12 * * 5'
  workflow_dispatch:
    inputs:
      keyword:
        description: 'The topic for the newsletter'
        required: true
        default: 'Artificial Intelligence'

jobs:
  drafting:
    runs-on: ubuntu-latest
    permissions:
      # This is required to allow the action to commit files back to the repository
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --- NEW DEBUGGING STEP ---
      - name: Debug Secrets Availability
        env:
          # We pass the secrets to this step's environment just for printing
          LS_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}
          LS_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LS_TRACING: ${{ secrets.LANGCHAIN_TRACING_V2 }}
        run: |
          echo "--- DEBUGGING SECRETS ---"
          echo "Project Name from Secret: ${{ env.LS_PROJECT }}"
          echo "Tracing V2 from Secret: ${{ env.LS_TRACING }}"
          echo "Is API Key Set?: $(if [ -n "$LS_API_KEY" ]; then echo 'true'; else echo 'false'; fi)"
          echo "API Key First 5 Chars: $(echo $LS_API_KEY | cut -c1-5)"
          echo "--- END DEBUGGING ---"

      - name: Run Drafting Workflow (Part 1)
        env:
          # Application API Keys
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KEYWORD_INPUT: ${{ github.event.inputs.keyword || 'Artificial Intelligence' }}
          
          # LangSmith Observability Keys passed to the Python script
          LANGCHAIN_TRACING_V2: ${{ secrets.LANGCHAIN_TRACING_V2 }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT: ${{ secrets.LANGCHAIN_PROJECT }}
        run: python run_part1_drafting.py

      - name: Commit Review Package (if it exists)
        run: |
          # Only proceed if the review package was actually created by the Python script
          if [ -f "review_package.json" ]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add review_package.json articles.db
            git commit -m "feat: Create newsletter draft for review"
            git push
          else
            echo "review_package.json not found. Skipping commit. This is normal if no articles passed curation."
          fi