# .github/workflows/1-create-draft.yml

name: "1: Create Newsletter Draft for Review"

on:
  # This workflow can be run on a schedule or manually
  schedule:
    # Runs every Friday at 12:00 PM UTC. You can change this.
    - cron: "0 12 * * 5"
  workflow_dispatch:
    inputs:
      keyword:
        description: "The topic for the newsletter"
        required: true
        default: "Blockchain"

jobs:
  drafting:
    runs-on: ubuntu-latest
    permissions:
      # This is required to allow the action to commit files back to the repository
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Drafting Agent Workflow (Part 1)
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Use the manual input if provided, otherwise use the default
          KEYWORD_INPUT: ${{ github.event.inputs.keyword || 'Blockchain' }}
        run: python run_part1_drafting_agent.py

      - name: Commit Review Package (if it exists)
        run: |
          # Only proceed if the review package was actually created by the Python script
          if [ -f "review_package.json" ]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add review_package.json articles.db
            git commit -m "feat: Create newsletter draft for review"
            git push
          else
            echo "review_package.json not found. Skipping commit. This is normal if no articles passed curation."
          fi
