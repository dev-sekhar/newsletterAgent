# .github/workflows/2-publish-newsletter.yml

name: "2: Publish Approved Newsletter"

on:
  # This workflow can ONLY be run manually from the Actions tab
  workflow_dispatch:

jobs:
  publishing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Ensure we check out the latest commit, which includes the human's edits
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Publishing Script (Part 2)
        env:
          # These keys are not strictly needed by the script but are included for consistency
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run_part2_publishing.py

      - name: Commit Final Newsletter (if it exists)
        run: |
          # Use a wildcard to check if any file starting with 'newsletter_' was created
          if ls newsletter_*.md 1> /dev/null 2>&1; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add newsletter_*.md
            git commit -m "docs: Publish final weekly newsletter"
            git push
          else
            echo "No newsletter file was generated to commit. This is normal if the approved articles list was empty."
          fi
