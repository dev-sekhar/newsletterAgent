name: "2: Publish Approved Newsletter"

on:
  workflow_dispatch: # This workflow can ONLY be run manually

jobs:
  publishing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # We need to pull the latest commit, which includes the human's edits
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Publishing Workflow (Part 2)
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run_part2_publishing.py

      - name: Commit Final Newsletter
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add newsletter_*.md
          if git diff --staged --quiet; then
            echo "No newsletter was generated."
          else
            git commit -m "docs: Publish final weekly newsletter"
            git push
          fi
