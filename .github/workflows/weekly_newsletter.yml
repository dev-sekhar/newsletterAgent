# .github/workflows/weekly_newsletter.yml

name: Generate Weekly Newsletter

on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      keyword:
        description: "The keyword to search for news articles"
        required: true
        default: "Blockchain"
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # ADD THIS PERMISSIONS BLOCK
    permissions:
      contents: write

    steps:
      # ... the rest of your file is exactly the same ...
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the agent to generate newsletter
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KEYWORD_INPUT: ${{ inputs.keyword }}
        run: |
          python main.py

      - name: Commit and push the new files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.md *.db
          if git diff --staged --quiet; then
            echo "No new articles found. No changes to commit."
          else
            git commit -m "📰 Automated Weekly Newsletter - $(date -u +'%Y-%m-%d')"
            git push
          fi
